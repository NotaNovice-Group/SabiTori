# Deploy: see services/community/README.md
name = "sabitori-community"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "sabitori-community"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "sabitori-teach-audio"

[vars]
# Origins allowed to call the service: the Android app (https://localhost), the iOS app (capacitor://localhost)
# and the web app. Comma-separated.
ALLOWED_ORIGINS = "https://localhost,capacitor://localhost,http://localhost,https://sabitori.pages.dev"
MAX_POSTS_PER_DAY = "30"
# Secrets (never in this file): npx wrangler secret put ADMIN_TOKEN ; npx wrangler secret put RATE_SALT
