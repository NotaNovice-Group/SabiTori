name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test, typecheck, packs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm -r typecheck
      - run: node scripts/check-packs.mjs

  e2e:
    name: End-to-end (browser)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm --filter @sabitori/app build
      - name: Install Chromium
        working-directory: apps/app
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: apps/app
        run: pnpm e2e
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: e2e-test-results
          path: apps/app/test-results
          retention-days: 7

  android-debug:
    name: Android debug build
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4.4.1
      - run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm --filter @sabitori/app build
      - name: Sync Capacitor
        working-directory: apps/app
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: apps/app/android
        run: ./gradlew assembleDebug --no-daemon
      # Google Play refuses a bundle whose base download is over 200 MB. The Kokoro model (177 MB) ships in the
      # install-time asset pack kokoro_pack instead: build the release bundle (unsigned; also exercises R8) and
      # check both the base module and the pack.
      - name: Release bundle fits Google Play (base under 200 MB, voice in its asset pack)
        working-directory: apps/app/android
        run: |
          ./gradlew bundleRelease --no-daemon
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile('app/build/outputs/bundle/release/app-release.aab')
          size = lambda p: sum(i.compress_size for i in z.infolist() if i.filename.startswith(p))
          base, pack = size('base/'), size('kokoro_pack/')
          names = [i.filename for i in z.infolist()]
          print(f'base module {base/1e6:.1f} MB, kokoro_pack {pack/1e6:.1f} MB')
          if base > 190e6: sys.exit('base module too large for Google Play (limit 200 MB)')
          if not any(n.endswith('kokoro_pack/kokoro.onnx') for n in names): sys.exit('kokoro_pack/kokoro.onnx missing from the asset pack')
          if any(n.endswith('model_uint8.onnx') for n in names): sys.exit('the Kokoro model is also in the base module')
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sabitori-debug-apk
          path: apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Pilot APK (docs/impact.md, "Pilot build"): the same app with the on-phone counter (VITE_PILOT=1), for
      # pilot participants. Debug-signed for side-loading; built on main only, to keep pull requests fast.
      - name: Build the pilot APK
        if: github.event_name == 'push'
        env:
          VITE_PILOT: '1'
        run: |
          pnpm --filter @sabitori/app build
          (cd apps/app && npx cap sync android)
          (cd apps/app/android && ./gradlew assembleDebug --no-daemon)
          cp apps/app/android/app/build/outputs/apk/debug/app-debug.apk sabitori-pilot-debug.apk
      - uses: actions/upload-artifact@v4.6.2
        if: github.event_name == 'push'
        with:
          name: sabitori-pilot-apk
          path: sabitori-pilot-debug.apk
          if-no-files-found: error
